# Hand-picked plans (robustness/make_split_datalog.py) -- same schema as
# robustness_config.toml, and the same datasets for each query, so the results
# line up with the random-plan sweep:
#
#     ./bench_runner.py -c robustness_config_hand.toml -o results/robustness_hand.jsonl
#     ./robustness_plot.py -i results/robustness_hand.jsonl
#
#     # hand plans next to the random sweep, one sub-box each per dataset
#     ./robustness_plot.py -i results/robustness_results_<random>.jsonl results/robustness_hand.jsonl
#
# To try a new heuristic: save its .dl under robustness/hand_selected_split/<query>/
# and add one algorithms line.  Name it after the idea (e.g. "light-first"),
# since the plot labels plans by these names.

[defaults]
workers = 64
seed = 42
repeat = 1
timeout_seconds = 600

# ---------------------------------------------------------------------------
[queries."5cycle"]
# edges a-b,b-c,c-d,d-e,e-a
# no one-rule plan in hand_selected_split/5cycle/ yet
datasets = [
    "data/amazon.csv:1:threshold=120",
    "data/berkstan.csv:0.3:threshold=120",
]
algorithms = [
    "base:flowlog:robustness/baseline/5cycle_baseline.dl:reference",
    "h1:flowlog:robustness/hand_selected_split/5cycle/h1.dl",
    "h2:flowlog:robustness/hand_selected_split/5cycle/h2.dl",
    "h3:flowlog:robustness/hand_selected_split/5cycle/h3.dl",
    "b1:flowlog:robustness/hand_selected_split/5cycle/b1.dl",
]

